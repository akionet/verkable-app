name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / unit / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm guard:bundle

  stubbed-browser:
    name: app against stubbed runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:bdd

  real-http-browser:
    name: built app against hermetic FastAPI
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CROSS_REPO_TOKEN: ${{ secrets.NAVIGATOR_CROSS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out reviewed core runtime
        if: env.CROSS_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: navigator/navigator-orchestrator-api
          ref: agent/operator-console-s5-plan
          token: ${{ env.CROSS_REPO_TOKEN }}
          path: .e2e/navigator-orchestrator-api

      - uses: pnpm/action-setup@v4
        if: env.CROSS_REPO_TOKEN != ''
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        if: env.CROSS_REPO_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        if: env.CROSS_REPO_TOKEN != ''

      - name: Install web and core dependencies
        if: env.CROSS_REPO_TOKEN != ''
        run: |
          pnpm install --frozen-lockfile
          uv sync --project .e2e/navigator-orchestrator-api --group dev
          pnpm exec playwright install --with-deps chromium

      - name: Complete the real HTTP/SSE operator journey
        if: env.CROSS_REPO_TOKEN != ''
        env:
          NAVIGATOR_CORE_PATH: .e2e/navigator-orchestrator-api
        run: pnpm test:e2e

      - name: Explain an unavailable cross-repository token
        if: env.CROSS_REPO_TOKEN == ''
        run: |
          echo "Real-HTTP BDD requires NAVIGATOR_CROSS_REPO_TOKEN with read access to navigator-orchestrator-api."
          echo "The same journey runs locally with NAVIGATOR_CORE_PATH and is a release gate."
