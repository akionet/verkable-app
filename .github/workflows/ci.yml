name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / unit / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:license
      - run: pnpm check:client
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm guard:bundle

  stubbed-browser:
    name: app against stubbed runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:bdd

  real-http-browser:
    name: built app against hermetic FastAPI
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # Both repositories are public, so this needs no credential. It was
      # previously gated on a cross-repository token, which meant every step
      # skipped when the secret was absent and the job reported green without
      # running anything — a passing check that proved nothing.
      - name: Check out the runtime
        uses: actions/checkout@v4
        with:
          repository: akionet/navigator-orchestrator-api
          ref: main
          path: .e2e/navigator-orchestrator-api

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5

      - name: Install web and core dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project .e2e/navigator-orchestrator-api --group dev
          pnpm exec playwright install --with-deps chromium

      - name: Complete the real HTTP/SSE operator journey
        env:
          NAVIGATOR_CORE_PATH: .e2e/navigator-orchestrator-api
        run: pnpm test:e2e
